<svg xmlns="http://www.w3.org/2000/svg" width="540" height="310" viewBox="0 0 540 310" role="img" aria-label="Arfan Ahmed · GitHub Overview">
  <defs>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>
  </defs>

  <rect width="540" height="310" rx="24" fill="#070d18"/>
  <circle cx="450" cy="58" r="46" fill="#8b5cf6" opacity="0.22" filter="url(#glow)"/>
  <circle cx="80" cy="262" r="40" fill="#2563eb" opacity="0.16" filter="url(#glow)"/>

  <rect x="1.25" y="1.25" width="537.5" height="307.5" rx="22.75" fill="url(#panelGrad)" stroke="url(#borderGrad)" stroke-opacity="0.38" stroke-width="1.5"/>
  <rect x="18" y="18" width="504" height="274" rx="20" fill="#0b1220" fill-opacity="0.84" stroke="#1e293b" stroke-opacity="0.8"/>

