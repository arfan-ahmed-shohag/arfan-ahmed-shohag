name: Update profile stats
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SVG cards
        env:
          STATS_USERNAME: arfan-ahmed-shohag
          GH_STATS_TOKEN: ${{ github.token }}
        run: python scripts/generate.py
      - name: Commit cards if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/overview.svg assets/languages.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh GitHub profile stats'
            git push
          fi
